plugins {
    id "com.android.application"
}

android {
    namespace "com.personalmemory.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.personalmemory.app"
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName "0.4.0"
    }

    buildTypes {
        debug {
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
